name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# CI never calls programscape.com: the CLI steps below would otherwise read its public catalog (0151). The catalog read
# has its own tests, with a mocked fetch.
env:
  PROGRAMSCAPE_ROUTER_CATALOG: "off"

jobs:
  check:
    permissions:
      contents: read
    name: typecheck, test, build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.23.4", "24.22.1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pack-smoke:
    permissions:
      contents: read
    name: pack, install and import (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.mode == '--keychain' && ', real keychain' || '' }}${{ matrix.mode == '--no-keychain' && ', no keychain' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu runners have no Secret Service: the router must still work with environment variables.
          - { os: ubuntu-latest, node: "22.23.4", mode: --no-keychain }
          - { os: ubuntu-latest, node: "24.22.1", mode: --no-keychain }
          # A real set -> get -> remove round trip, under the test service programscape-router-ci.
          - { os: macos-latest, node: "22.23.4", mode: --keychain }
          - { os: windows-latest, node: "22.23.4", mode: --keychain }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Packs the tarball, installs it into a fresh project, imports it as ESM, type-checks its .d.ts files
      # as a consumer would, runs the bin, and exercises the keychain (or its absence).
      - run: npm run smoke:pack -- ${{ matrix.mode }}
      - name: Pipe a key in from PowerShell and cmd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The test-only entry point switches the keychain service to programscape-router-ci.
          # PowerShell pipes add CRLF; keys set --stdin must take the first line only.
          'exa-from-pwsh' | node scripts/keychain-cli.mjs . programscape-router-ci keys set exa --stdin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $list = node scripts/keychain-cli.mjs . programscape-router-ci keys list --json | ConvertFrom-Json
          if (($list.keys | Where-Object provider -eq 'exa').source -ne 'keychain') { exit 1 }
          cmd /c "echo exa-from-cmd| node scripts\keychain-cli.mjs . programscape-router-ci keys set exa --stdin"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/keychain-cli.mjs . programscape-router-ci keys remove exa
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the README's PowerShell prompts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if (-not (Get-Command Read-Host).Parameters.ContainsKey('AsSecureString')) { exit 1 }
          $s = ConvertTo-SecureString 'tvly-check' -AsPlainText -Force
          $env:TAVILY_API_KEY = [System.Net.NetworkCredential]::new('', $s).Password
          if ($env:TAVILY_API_KEY -ne 'tvly-check') { exit 1 }
      - name: Check the README's PowerShell prompts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if (-not (Get-Command Read-Host).Parameters.ContainsKey('MaskInput')) { exit 1 }

  omit-optional:
    permissions:
      contents: read
    name: build and run without the optional keychain module (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: npm
      # As a source or GitHub install would, with optional dependencies left out: `prepare` builds without them.
      - run: npm ci --omit=optional
      - run: test ! -d node_modules/@napi-rs/keyring
      - run: npm run build
      - name: keys list exits cleanly and explains that the keychain is unavailable
        run: |
          out="$(node dist/cli.js keys list)"
          echo "$out"
          echo "$out" | grep -q "its native module (@napi-rs/keyring"
      - name: the router still works with an environment key
        run: EXA_API_KEY=exa-dummy node dist/cli.js status --json | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); if (s.providers.find(p=>p.id==="exa").keySource!=="env" || !s.keychainNote) process.exit(1)'

